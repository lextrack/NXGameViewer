name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Build, test and package in Docker
        run: ./packaging/linux/make-appimage.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: NXGameViewer-linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          update: true
      - name: Build, test and package
        run: bash packaging/windows/build-windows.sh --install-deps
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: NXGameViewer-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
